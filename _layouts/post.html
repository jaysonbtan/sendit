---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.excerpt %}
    <p class="post-excerpt">{{ page.excerpt }}</p>
    {% endif %}
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <footer class="post-footer">
    <a href="{{ '/blog.html' | relative_url }}" class="btn btn-secondary">&larr; All Announcements</a>
  </footer>
</article>
